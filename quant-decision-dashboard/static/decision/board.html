<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>板块分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
<!-- 左侧固定侧边导航 -->
<div class="sidebar">
    <h4 class="text-center text-white mb-4">量化决策系统</h4>
    <nav class="nav flex-column">
        <a href="index.html" class="nav-link">📊 总控仪表盘</a>
        <a href="macro.html" class="nav-link">📈 宏观诊断</a>
        <a href="board.html" class="nav-link active">🏷️ 板块分析</a>
        <a href="stock.html" class="nav-link">📋 个股交易</a>
        <a href="system.html" class="nav-link">⚙️ 系统设置</a>
    </nav>
</div>

<!-- 顶部状态栏 -->
<div class="top-bar">
    <div>
        <span>系统状态：<span class="text-success">运行正常</span></span>
    </div>
</div>

<!-- 右侧主内容区 -->
<div class="main-content">
    <h2 class="mt-4">板块分析</h2>
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">板块表现</div>
                <div class="card-body">
                    <div id="sectorChart" style="height: 400px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 初始化图表
const sectorChart = echarts.init(document.getElementById('sectorChart'));

// 示例数据
const option = {
    title: {
        text: '各板块表现'
    },
    tooltip: {},
    legend: {
        data: ['涨幅']
    },
    xAxis: {
        data: ['金融', '科技', '消费', '能源', '材料']
    },
    yAxis: {},
    series: [{
        name: '涨幅',
        type: 'bar',
        data: [5.5, 10.2, -3.1, 7.8, 2.4]
    }]
};

// 使用刚指定的配置项和数据显示图表。
sectorChart.setOption(option);

// 图表自适应
window.addEventListener('resize', ()=>{
    sectorChart.resize();
});
</script>
</body>
</html>
