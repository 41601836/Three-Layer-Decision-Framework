<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化决策系统 - 总控仪表盘</title>
    <!-- 外部CDN资源 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <!-- 本地公共资源 -->
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
<!-- 左侧固定侧边栏 -->
<div class="sidebar">
    <h4 class="text-center text-white mb-4 pt-2">量化决策系统</h4>
    <nav class="nav flex-column">
        <a href="index.html" class="nav-link">📊 总控仪表盘</a>
        <a href="macro.html" class="nav-link">📈 宏观诊断</a>
        <a href="board.html" class="nav-link">🏷️ 板块分析</a>
        <a href="stock.html" class="nav-link">📋 个股交易</a>
        <a href="system.html" class="nav-link">⚙️ 系统设置</a>
    </nav>
</div>

<!-- 顶部状态栏 -->
<div class="top-bar">
    <div class="system-info">
        <span>系统状态：<span class="text-success">运行正常</span></span>
        <span class="ms-4">上证指数：<span class="rise">3200.00 +0.80%</span></span>
        <span class="ms-4">深证成指：<span class="rise">10500.00 +0.50%</span></span>
    </div>
    <div class="operate-group">
        <button id="runTotalBtn" class="btn btn-primary">一键执行全流程</button>
        <span id="loadingTip" class="text-warning ms-2 d-none"></span>
    </div>
</div>

<!-- 右侧主内容区 -->
<div class="main-content">
    <!-- 第一行：核心指标卡片 -->
    <div class="row g-4">
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">流程状态</div>
                <div class="card-body" id="flowStatus">等待执行</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">大盘模式</div>
                <div class="card-body" id="marketMode">--</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">主流风格</div>
                <div class="card-body" id="mainStyle">--</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">资金虹吸等级</div>
                <div class="card-body" id="siphonLevel">--</div>
            </div>
        </div>
    </div>

    <!-- 第二行：ECharts 图表卡片 -->
    <div class="row g-4 mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">宏观综合得分</div>
                <div class="card-body">
                    <div id="scoreChart" style="height: 300px;"></div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">市场仓位分布</div>
                <div class="card-body">
                    <div id="posChart" style="height: 300px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 第三行：交易指令表格 -->
    <div class="card mt-4">
        <div class="card-header">✅ 标准化交易指令 & 筛选明细</div>
        <div class="card-body">
            <table class="table table-dark table-striped table-hover">
                <thead>
                    <tr>
                        <th>个股代码</th>
                        <th>个股名称</th>
                        <th>综合评级</th>
                        <th>入场区间</th>
                        <th>固定止损</th>
                        <th>第一止盈</th>
                        <th>建议仓位</th>
                        <th>筛选拦截原因</th>
                    </tr>
                </thead>
                <tbody id="tradeTableBody">
                    <tr>
                        <td colspan="8" class="text-center">请点击上方【一键执行全流程】加载数据</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 第四行：风险 & 数据缺失提示 -->
    <div class="card mt-4">
        <div class="card-header">⚠️ 全局风险 & 数据缺失汇总</div>
        <div class="card-body" id="riskMissBox">暂无风险与数据缺失</div>
    </div>
</div>

<!-- 引入公共脚本 -->
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/chart.js"></script>

<script>
    // 页面加载完成：导航自动高亮
    $(function () {
        // 使用 common.js 提供的导航激活方法
        try{ if(window.activateNav) activateNav(); }catch(e){ console.warn('activateNav not available', e); }

        // 一键执行按钮点击事件
        $('#runTotalBtn').on('click', function () {
            try{ if(window.showLoading) showLoading('计算中...'); else $('#loadingTip').removeClass('d-none').text('计算中...'); }catch(e){}

            // 调用全流程接口
            api.runTotal(function (res) {
                try{ if(window.hideLoading) hideLoading(); else $('#loadingTip').addClass('d-none').text(''); }catch(e){}

                if(!res){ showTip && showTip('接口返回为空', 'error'); return; }
                if (res.code !== 200) {
                    showTip && showTip('接口请求异常：' + (res.msg || '未知错误'), 'error');
                    return;
                }
                const data = res.data || {};
                renderPageData(data);
            });
        });

        // 窗口自适应图表
        window.addEventListener('resize', function () {
            // chartUtil 会自动 resize 内部实例
            try{ if(window.chartUtil && chartUtil._resize) chartUtil._resize(); }catch(e){}
        });
    });

    /**
     * 渲染页面全部数据
     * @param {Object} data 接口返回全流程结果
     */
    function renderPageData(data) {
        // 1. 渲染核心指标卡片（防空）
        $('#flowStatus').text(data.total_flow_status || '未知');
        $('#marketMode').text((data.macro_summary && data.macro_summary.operate_mode) || '--');
        $('#mainStyle').text((data.board_summary && data.board_summary.main_style) || '--');
        $('#siphonLevel').text((data.board_summary && data.board_summary.siphon_level) || '--');

        // 2. 渲染柱状图：宏观综合得分
        try{
            chartUtil.renderBar(document.getElementById('scoreChart'), ['宏观总分'], [ (data.macro_summary && data.macro_summary.total_score) || 0 ]);
        }catch(e){ console.warn('renderBar error', e); }

        // 3. 渲染饼图：市场仓位分布
        try{
            const pos = (data.market_total_pos!=null) ? data.market_total_pos : (data.market_pos || 0);
            const posData = [ { name: '持仓仓位', value: Number(pos) }, { name: '空仓部分', value: Math.max(0, 1 - Number(pos)) } ];
            chartUtil.renderPie(document.getElementById('posChart'), posData);
        }catch(e){ console.warn('renderPie error', e); }

        // 4. 渲染交易表格
        renderTradeTable(Array.isArray(data.final_trade_list) ? data.final_trade_list : []);

        // 5. 渲染风险 & 数据缺失
        const riskText = Array.isArray(data.global_risk_list) && data.global_risk_list.length > 0
            ? data.global_risk_list.join('；')
            : '无全局风险';
        const missText = Array.isArray(data.all_data_missing) && data.all_data_missing.length > 0
            ? data.all_data_missing.join('；')
            : '无数据缺失';
        $('#riskMissBox').html(`
            <p>全局风险：<span class="${riskText.includes('高') ? 'risk-high' : 'text-warning'}">${riskText}</span></p>
            <p>数据缺失/筛选拦截：<span class="text-warning">${missText}</span></p>
        `);
    }

    /**
     * 渲染交易指令表格
     * @param {Array} stockList 个股列表
     */
    function renderTradeTable(stockList) {
        let html = '';
        if (!stockList || stockList.length === 0) {
            html = '<tr><td colspan="8" class="text-center text-warning">暂无候选个股（筛选规则过滤）</td></tr>';
        } else {
            stockList.forEach(item => {
                const reasons = (Array.isArray(item.intercept_reasons) && item.intercept_reasons.length>0) ? item.intercept_reasons.join('；') : (item.risk_tip || '正常通过');
                const reasonClass = (Array.isArray(item.intercept_reasons) && item.intercept_reasons.length>0) ? 'intercept-warning' : 'intercept-normal';
                html += `
                <tr>
                    <td>${item.stock_code || ''}</td>
                    <td>${item.stock_name || ''}</td>
                    <td>${item.stock_level || ''}</td>
                    <td>${item.entry_zone || ''}</td>
                    <td>${item.stop_loss_price != null ? item.stop_loss_price : ''}</td>
                    <td>${item.first_profit_price != null ? item.first_profit_price : ''}</td>
                    <td>${typeof item.suggest_position === 'number' ? (item.suggest_position*100).toFixed(1) + '%' : ''}</td>
                    <td class="${reasonClass}">${escapeHtml(reasons)}</td>
                </tr>
                `;
            });
        }
        $('#tradeTableBody').html(html);
    }

    // 简单防XSS
    function escapeHtml(str){
        if(str==null) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
</script>
</body>
</html>
