# StockAI v4.0 多因子 ML 策略配置文件
# =====================================
# 最优配置: 路径A+B (top10% + MA5企稳过滤)
# 回测结果(2025年): 胜率46.2% | 年化收益14.96% | 夏普比率1.878 | 最大回撤-3.35%

# 选股参数
top_pct: 10                     # 全市场前百分之多少的ML得分列为候选池 (最优: 10%)
hold_days: 10                   # 波段持仓天数

# 过滤选项
no_industry_filter: false       # 是否关闭行业强度共振过滤
no_market_limit: false          # 是否关闭大盘预警的仓位限制(仅在黑色时强制清仓)
require_top_inst: false         # 仅买入过去5日有大宗交易"机构专用"买方成交的股票
require_ma5_filter: true        # MA5企稳过滤：仅买入收盘价高于5日均线的股票（避开下跌趋势）

# 建仓节奏（星期过滤）
weekday_filter: ""              # 仅允许在指定星期建仓，格式: "0,1" 表示仅周一/周二（0=周一,4=周五）

# 仓位管理参数（从 backtest_ml_strategy.py 读取）
# SINGLE_POS_PCT: 0.03          # 单只股票建仓限额 3%
# INDUSTRY_POS_LIMIT: 0.15      # 单行业仓位限制 15%
