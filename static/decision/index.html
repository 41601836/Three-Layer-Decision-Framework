<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化决策系统 - 总控仪表盘</title>
    <!-- 外部CDN资源 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- SheetJS Excel 导出库 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- 本地公共资源 -->
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
<!-- 左侧固定侧边栏 -->
<div class="sidebar">
    <h4 class="text-center text-white mb-4 pt-2">量化决策系统</h4>
    <nav class="nav flex-column">
        <a href="index.html" class="nav-link">📊 总控仪表盘</a>
        <a href="macro.html" class="nav-link">📈 宏观诊断</a>
        <a href="board.html" class="nav-link">🏷️ 板块分析</a>
        <a href="stock.html" class="nav-link">📋 个股交易</a>
        <a href="ml_strategy.html" class="nav-link">🧠 ML策略(v4.0)</a>
        <a href="backtest.html" class="nav-link">📈 策略回测</a>
        <a href="system.html" class="nav-link">⚙️ 系统设置</a>
    </nav>
</div>

<!-- 顶部状态栏 -->
<div class="top-bar">
    <div class="system-info">
        <span>系统状态：<span class="text-success">运行正常</span></span>
        <span class="ms-4">上证指数：<span class="rise">3200.00 +0.80%</span></span>
        <span class="ms-4">深证成指：<span class="rise">10500.00 +0.50%</span></span>
    </div>
    <div class="operate-group">
        <button id="runTotalBtn" class="btn btn-primary">一键执行全流程</button>
        <span id="loadingTip" class="text-warning ms-2 d-none"></span>
    </div>
</div>

<!-- 右侧主内容区 -->
<div class="main-content">
    <!-- 第一行：核心指标卡片 -->
    <div class="row g-4">
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">流程状态</div>
                <div class="card-body" id="flowStatus">等待执行</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">大盘模式</div>
                <div class="card-body" id="marketMode">--</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">主流风格</div>
                <div class="card-body" id="mainStyle">--</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">资金虹吸等级</div>
                <div class="card-body" id="siphonLevel">--</div>
            </div>
        </div>
    </div>

    <!-- 第二行：ECharts 图表卡片 -->
    <div class="row g-4 mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">宏观综合得分</div>
                <div class="card-body">
                    <div id="scoreChart" style="height: 300px;"></div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">市场仓位分布</div>
                <div class="card-body">
                    <div id="posChart" style="height: 300px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 第三行：交易指令表格 -->
    <div class="card mt-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>✅ 标准化交易指令 & 筛选明细</span>
            <button id="exportTradeTableBtn" class="btn btn-sm btn-outline-success" disabled>📥 导出Excel</button>
        </div>
        <div class="card-body">
            <table class="table table-dark table-striped table-hover">
                <thead>
                    <tr>
                        <th class="sortable-header" data-sort="stock_code">个股代码</th>
                        <th>个股名称</th>
                        <th class="sortable-header" data-sort="stock_level">综合评级</th>
                        <th class="sortable-header" data-sort="entry_zone">入场区间</th>
                        <th>固定止损</th>
                        <th>第一止盈</th>
                        <th class="sortable-header" data-sort="suggest_position">建议仓位</th>
                        <th>筛选拦截原因</th>
                    </tr>
                </thead>
                <tbody id="tradeTableBody">
                    <tr>
                        <td colspan="8" class="text-center">请点击上方【一键执行全流程】加载数据</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 第四行：风险 & 数据缺失提示 -->
    <div class="card mt-4">
        <div class="card-header">⚠️ 全局风险 & 数据缺失汇总</div>
        <div class="card-body" id="riskMissBox">暂无风险与数据缺失</div>
    </div>
</div>

<!-- 引入公共脚本 -->
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/chart.js"></script>

<script>
    // 页面加载完成：导航自动高亮
    $(function () {
        // 使用 common.js 提供的导航激活方法
        try{ if(window.activateNav) activateNav(); }catch(e){ console.warn('activateNav not available', e); }

        // 表头排序点击事件
        $(document).on('click', 'th.sortable-header[data-sort]', function () {
            const field = $(this).data('sort');
            sortTradeTable(field);
        });

        // Excel 导出按钮点击事件
        $('#exportTradeTableBtn').on('click', function () {
            exportTradeTableToExcel();
        });

        // 一键执行按钮点击事件
        $('#runTotalBtn').on('click', function () {
            try{ if(window.showLoading) showLoading('计算中...'); else $('#loadingTip').removeClass('d-none').text('计算中...'); }catch(e){}

            // 调用全流程接口
            api.runTotal(function (res) {
                try{ if(window.hideLoading) hideLoading(); else $('#loadingTip').addClass('d-none').text(''); }catch(e){}

                if(!res){ showTip && showTip('接口返回为空', 'error'); return; }
                if (res.code !== 200) {
                    showTip && showTip('接口请求异常：' + (res.msg || '未知错误'), 'error');
                    return;
                }
                const data = res.data || {};
                renderPageData(data);
            });
        });

        // 窗口自适应图表
        window.addEventListener('resize', function () {
            // chartUtil 会自动 resize 内部实例
            try{ if(window.chartUtil && chartUtil._resize) chartUtil._resize(); }catch(e){}
        });
    });

    /**
     * 渲染页面全部数据
     * @param {Object} data 接口返回全流程结果
     */
    function renderPageData(data) {
        // 1. 渲染核心指标卡片（防空）
        $('#flowStatus').text(data.total_flow_status || '未知');
        $('#marketMode').text((data.macro_summary && data.macro_summary.operate_mode) || '--');
        $('#mainStyle').text((data.board_summary && data.board_summary.main_style) || '--');
        $('#siphonLevel').text((data.board_summary && data.board_summary.siphon_level) || '--');

        // 2. 渲染柱状图：宏观综合得分
        try{
            chartUtil.renderBar(document.getElementById('scoreChart'), ['宏观总分'], [ (data.macro_summary && data.macro_summary.total_score) || 0 ]);
        }catch(e){ console.warn('renderBar error', e); }

        // 3. 渲染饼图：市场仓位分布
        try{
            const pos = (data.market_total_pos!=null) ? data.market_total_pos : (data.market_pos || 0);
            const posData = [ { name: '持仓仓位', value: Number(pos) }, { name: '空仓部分', value: Math.max(0, 1 - Number(pos)) } ];
            chartUtil.renderPie(document.getElementById('posChart'), posData);
        }catch(e){ console.warn('renderPie error', e); }

        // 4. 渲染交易表格
        renderTradeTable(Array.isArray(data.final_trade_list) ? data.final_trade_list : []);

        // 5. 渲染风险 & 数据缺失
        const riskText = Array.isArray(data.global_risk_list) && data.global_risk_list.length > 0
            ? data.global_risk_list.join('；')
            : '无全局风险';
        const missText = Array.isArray(data.all_data_missing) && data.all_data_missing.length > 0
            ? data.all_data_missing.join('；')
            : '无数据缺失';
        $('#riskMissBox').html(`
            <p>全局风险：<span class="${riskText.includes('高') ? 'risk-high' : 'text-warning'}">${riskText}</span></p>
            <p>数据缺失/筛选拦截：<span class="text-warning">${missText}</span></p>
        `);
    }

    /**
     * 交易表格排序状态管理
     */
    const tradeTableSort = {
        currentField: null,
        isAsc: true,
        data: []
    };

    /**
     * 排序表格数据并重新渲染
     * @param {string} field 要排序的字段名
     */
    function sortTradeTable(field) {
        if (!tradeTableSort.data || tradeTableSort.data.length === 0) return;

        // 如果点击同一个字段，切换升降序
        if (tradeTableSort.currentField === field) {
            tradeTableSort.isAsc = !tradeTableSort.isAsc;
        } else {
            tradeTableSort.currentField = field;
            tradeTableSort.isAsc = true;
        }

        // 排序逻辑
        const sorted = [...tradeTableSort.data].sort((a, b) => {
            let aVal = a[field];
            let bVal = b[field];

            // 数字字段转换为数值
            if (field === 'suggest_position') {
                aVal = typeof aVal === 'number' ? aVal : 0;
                bVal = typeof bVal === 'number' ? bVal : 0;
                return tradeTableSort.isAsc ? aVal - bVal : bVal - aVal;
            }

            // 文本字段按字符串排序
            aVal = String(aVal || '').toLowerCase();
            bVal = String(bVal || '').toLowerCase();
            if (tradeTableSort.isAsc) {
                return aVal.localeCompare(bVal, 'zh-CN');
            } else {
                return bVal.localeCompare(aVal, 'zh-CN');
            }
        });

        // 更新排序箭头指示符
        $('th[data-sort]').removeClass('sort-asc sort-desc');
        const activeHeader = $(`th[data-sort="${field}"]`);
        activeHeader.addClass(tradeTableSort.isAsc ? 'sort-asc' : 'sort-desc');

        // 重新渲染表格（使用排序后的数据）
        renderTradeTable(sorted);
    }

    /**
     * 判断拦截原因的规则类型，返回对应高亮类和说明文本
     * @param {string} reason 拦截原因文本
     * @returns {Object} {className, title}
     */
    function classifyReason(reason) {
        if(!reason) return {className: 'intercept-normal', title: ''};
        
        // 均线/量能类规则
        if(reason.includes('均线') || reason.includes('量能') || reason.includes('量比')) {
            return {className: 'intercept-ma', title: '均线/量能类过滤'};
        }
        // 涨幅/换手率类规则
        if(reason.includes('涨幅') || reason.includes('换手')) {
            return {className: 'intercept-vol', title: '涨幅/换手率类过滤'};
        }
        // 风控禁入区规则
        if(reason.includes('禁入') || reason.includes('风控') || reason.includes('压力位')) {
            return {className: 'intercept-risk', title: '风控禁入区过滤'};
        }
        // 其他过滤规则
        if(reason.includes('过滤') || reason.includes('拦截')) {
            return {className: 'intercept-other', title: '其他筛选规则过滤'};
        }
        // 正常通过
        return {className: 'intercept-normal', title: ''};
    }

    /**
     * 渲染交易指令表格
     * @param {Array} stockList 个股列表
     */
    function renderTradeTable(stockList) {
        // 保存原始数据用于排序
        if (!window.sortInitialized && stockList && stockList.length > 0) {
            tradeTableSort.data = stockList;
            window.sortInitialized = true;
        }

        let html = '';
        const hasData = stockList && stockList.length > 0;
        
        if (!hasData) {
            html = '<tr><td colspan="8" class="text-center text-warning">暂无候选个股（筛选规则过滤）</td></tr>';
            // 禁用导出按钮
            $('#exportTradeTableBtn').prop('disabled', true).attr('title', '暂无数据可导出');
        } else {
            stockList.forEach(item => {
                const reasons = (Array.isArray(item.intercept_reasons) && item.intercept_reasons.length>0) ? item.intercept_reasons.join('；') : (item.risk_tip || '正常通过');
                const typeInfo = classifyReason(reasons);
                const tooltipTitle = typeInfo.title ? `title="${typeInfo.title}"` : '';
                html += `
                <tr>
                    <td>${item.stock_code || ''}</td>
                    <td>${item.stock_name || ''}</td>
                    <td>${item.stock_level || ''}</td>
                    <td>${item.entry_zone || ''}</td>
                    <td>${item.stop_loss_price != null ? item.stop_loss_price : ''}</td>
                    <td>${item.first_profit_price != null ? item.first_profit_price : ''}</td>
                    <td>${typeof item.suggest_position === 'number' ? (item.suggest_position*100).toFixed(1) + '%' : ''}</td>
                    <td class="${typeInfo.className}" ${tooltipTitle}>${escapeHtml(reasons)}</td>
                </tr>
                `;
            });
            // 启用导出按钮
            $('#exportTradeTableBtn').prop('disabled', false).removeAttr('title');
        }
        $('#tradeTableBody').html(html);
    }

    // 简单防XSS
    function escapeHtml(str){
        if(str==null) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    /**
     * 导出交易表格到 Excel
     * 支持表格排序后的结果导出
     */
    function exportTradeTableToExcel() {
        // 检查是否有数据
        if (!tradeTableSort.data || tradeTableSort.data.length === 0) {
            showTip && showTip('暂无数据可导出', 'warning');
            return;
        }

        try {
            // 显示加载提示
            showTip && showTip('正在导出...', 'info');

            // 准备导出数据
            const headers = ['个股代码', '个股名称', '综合评级', '入场区间', '固定止损', '第一止盈', '建议仓位', '筛选拦截原因'];
            const exportData = [];

            // 获取当前表格中的所有行（如果已排序则为排序后的数据）
            const rows = $('#tradeTableBody tr');
            rows.each(function (index) {
                const cells = $(this).find('td');
                if (cells.length === 8) {
                    // 逐个提取单元格内容
                    const rowData = [];
                    for (let i = 0; i < 8; i++) {
                        let cellText = cells.eq(i).text().trim();
                        rowData.push(cellText);
                    }
                    exportData.push(rowData);
                }
            });

            if (exportData.length === 0) {
                showTip && showTip('表格数据为空', 'warning');
                return;
            }

            // 使用 SheetJS 创建工作簿
            const workbook = XLSX.utils.book_new();
            const worksheet = XLSX.utils.aoa_to_sheet([headers, ...exportData]);
            
            // 设置列宽
            worksheet['!cols'] = [
                { wch: 12 },  // 个股代码
                { wch: 12 },  // 个股名称
                { wch: 10 },  // 综合评级
                { wch: 10 },  // 入场区间
                { wch: 10 },  // 固定止损
                { wch: 10 },  // 第一止盈
                { wch: 10 },  // 建议仓位
                { wch: 20 }   // 筛选拦截原因
            ];

            XLSX.utils.book_append_sheet(workbook, worksheet, '交易指令');

            // 生成文件名：YYYY-MM-DD_交易指令.xlsx
            const today = new Date();
            const dateStr = today.getFullYear() + 
                            String(today.getMonth() + 1).padStart(2, '0') + 
                            String(today.getDate()).padStart(2, '0');
            const filename = `${dateStr.slice(0, 4)}-${dateStr.slice(4, 6)}-${dateStr.slice(6, 8)}_交易指令.xlsx`;

            // 写入文件
            XLSX.writeFile(workbook, filename);

            // 导出成功提示
            setTimeout(() => {
                showTip && showTip('导出成功：' + filename, 'success');
            }, 300);

        } catch (error) {
            console.error('导出 Excel 失败:', error);
            showTip && showTip('导出失败：' + error.message, 'error');
        }
    }
</script>
</body>
</html>
